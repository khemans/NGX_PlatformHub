# Terraform: format check and validate for infrastructure + stacks roots.
stages:
  - validate

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

.terraform_root_job:
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  parallel:
    matrix:
      - TF_ROOT: [terraform/infrastructure/vpc, terraform/infrastructure/dynamodb, terraform/infrastructure/s3_state, terraform/stacks/security_groups, terraform/stacks/secrets, terraform/stacks/aurora, terraform/stacks/ecs_fargate]

terraform:fmt:
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  stage: validate
  script:
    - terraform fmt -check -recursive terraform

terraform:validate:
  extends: .terraform_root_job
  stage: validate
  needs: ["terraform:fmt"]
  script:
    - cd "${TF_ROOT}"
    - terraform init -backend=false -input=false
    - terraform validate
