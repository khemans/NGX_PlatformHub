name: Terraform

on:
  push:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  fmt:
    name: Terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform

  validate:
    name: Validate (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: infrastructure-vpc
            tf_root: terraform/infrastructure/vpc
          - label: infrastructure-dynamodb
            tf_root: terraform/infrastructure/dynamodb
          - label: infrastructure-s3_state
            tf_root: terraform/infrastructure/s3_state
          - label: stacks-security_groups
            tf_root: terraform/stacks/security_groups
          - label: stacks-secrets
            tf_root: terraform/stacks/secrets
          - label: stacks-aurora
            tf_root: terraform/stacks/aurora
          - label: stacks-ecs_fargate
            tf_root: terraform/stacks/ecs_fargate
    defaults:
      run:
        working-directory: ${{ matrix.tf_root }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate
